<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <title>Lancer (Old Guild) — 5×8 Isometric Sprite &amp; Combat Previewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #0f1117;
      --content: #161922;
      --card: #1c202b;
      --card-border: #2e3446;
      --border: #384057;
      --foreground: #e2e8f0;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #0f172a;
    }
    body {
      background-color: var(--background) !important;
      color: var(--foreground) !important;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      padding: 1.25rem !important;
      max-width: 1120px;
      margin: 0 auto !important;
    }
    #isoCanvas {
      height: 520px !important;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2 space-y-2">
    <!-- Top Control Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)] text-xs">
      <div class="flex items-center gap-1 flex-wrap">
        <span class="text-[var(--muted-foreground)] font-medium">Unit:</span>
        <button id="btn-both" onclick="setUnit('both')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">Both</button>
        <button id="btn-male" onclick="setUnit('male')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Male</button>
        <button id="btn-female" onclick="setUnit('female')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Female</button>

        <span class="text-[var(--muted-foreground)] font-medium ml-1.5">Anim:</span>
        <button id="anim-idle" onclick="setAnim('idle')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Idle</button>
        <button id="anim-walk" onclick="setAnim('walk')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Walk</button>
        <button id="anim-run" onclick="setAnim('run')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Run</button>
        <button id="anim-sword" onclick="setAnim('sword')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">Sword ⚔️</button>
        <button id="anim-bow" onclick="setAnim('bow')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Bow 🏹</button>
        <button id="anim-patrol" onclick="setAnim('patrol')" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">Patrol</button>
      </div>

      <div class="flex items-center gap-1 flex-wrap">
        <button id="dir-SE" onclick="setDir('SE')" class="px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-mono">SE↘</button>
        <button id="dir-SW" onclick="setDir('SW')" class="px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-mono">SW↙</button>
        <button id="dir-NW" onclick="setDir('NW')" class="px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-mono">NW↖</button>
        <button id="dir-NE" onclick="setDir('NE')" class="px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-mono">NE↗</button>
      </div>
    </div>

    <!-- Main Isometric Viewport -->
    <div class="relative w-full rounded border border-[var(--card-border)] bg-[var(--card)] overflow-hidden" style="height: 520px;">
      <canvas id="isoCanvas" class="w-full h-full cursor-pointer"></canvas>
      <div class="absolute top-2 left-2.5 flex items-center gap-2 pointer-events-none text-xs">
        <span id="statusBadge" class="px-2 py-0.5 rounded bg-[var(--background)]/80 border border-[var(--border)] font-mono text-[var(--foreground)]">
          Frame 1/8 · Sword ⚔️ (SE) · 11 FPS
        </span>
      </div>
      <div class="absolute bottom-2 left-2.5 pointer-events-none text-xs text-[var(--muted-foreground)]">
        Click any tile to move or aim attack · 5×8 Isometric Cycles (Idle / Walk / Run / Sword / Bow)
      </div>
    </div>

    <!-- Bottom Secondary Bar -->
    <div class="flex flex-wrap items-center justify-between gap-3 pt-1 text-xs">
      <div class="flex items-center gap-3">
        <label class="text-[var(--muted-foreground)] flex items-center gap-1.5">
          Speed
          <input id="fpsRange" type="range" min="4" max="18" value="11" oninput="updateFps(this.value)" class="w-20 accent-[var(--primary)]" />
          <span id="fpsLabel" class="font-mono tabular-nums text-[var(--foreground)] w-12">11 FPS</span>
        </label>
        <label class="text-[var(--muted-foreground)] flex items-center gap-1.5">
          Scale
          <input id="zoomRange" type="range" min="70" max="150" value="105" oninput="updateZoom(this.value)" class="w-20 accent-[var(--primary)]" />
          <span id="zoomLabel" class="font-mono tabular-nums text-[var(--foreground)] w-10">1.05x</span>
        </label>
      </div>
      <div class="flex items-center gap-2">
        <label class="flex items-center gap-1.5 cursor-pointer text-[var(--foreground)]">
          <input id="chkTrail" type="checkbox" checked onchange="toggleTrail(this.checked)" class="accent-[var(--primary)]" />
          <span>Archeotek Trail</span>
        </label>
        <button id="btnPause" onclick="togglePlay()" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-mono">⏸ Pause</button>
        <button onclick="stepFrame()" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-mono">⏭ Step</button>
      </div>
    </div>
  </div>

      if (u === 'female') { state.units.female.gx = 2; state.units.female.gy = 2; state.units.female.tx = 2; state.units.female.ty = 2; }
      if (u === 'both') {
        state.units.male.gx = 1; state.units.male.gy = 2.6; state.units.male.tx = 1; state.units.male.ty = 2.6;
        state.units.female.gx = 3; state.units.female.gy = 1.4; state.units.female.tx = 3; state.units.female.ty = 1.4;
      }
      updateButtons();
    }

    function setAnim(a) {
      state.anim = a;
      const defaultFps = a === 'idle' ? 7 : (a === 'walk' ? 10 : (a === 'bow' ? 9 : (a === 'sword' ? 11 : 12)));
      updateFps(defaultFps);
      document.getElementById('fpsRange').value = defaultFps;
      state.frame = 0;
      updateButtons();
    }

    function setDir(d) {
      state.dir = d;
      state.units.male.dir = d;
      state.units.female.dir = d;
      updateButtons();
    }

    function updateFps(val) {
      state.fps = parseInt(val, 10);
      document.getElementById('fpsLabel').textContent = state.fps + ' FPS';
    }

    function updateZoom(val) {
      state.zoom = parseInt(val, 10) / 100;
      document.getElementById('zoomLabel').textContent = state.zoom.toFixed(2) + 'x';
    }

    function toggleTrail(checked) {
      state.temporalTrail = checked;
    }

    function togglePlay() {
      state.playing = !state.playing;
      document.getElementById('btnPause').textContent = state.playing ? '⏸ Pause' : '▶ Play';
    }

    function stepFrame() {
      state.playing = false;
      document.getElementById('btnPause').textContent = '▶ Play';
      state.frame = (state.frame + 1) % FRAME_COLS;
    }

    function isoToScreen(gx, gy, originX, originY) {
      const tw = TILE_W * state.zoom;
      const th = TILE_H * state.zoom;
      return {
        x: originX + (gx - gy) * (tw / 2),
        y: originY + (gx + gy) * (th / 2)
      };
    }

    function screenToIso(sx, sy, originX, originY) {
      const tw = TILE_W * state.zoom;
      const th = TILE_H * state.zoom;
      const dx = sx - originX;
      const dy = sy - originY;
      const gx = (dx / (tw / 2) + dy / (th / 2)) / 2;
      const gy = (dy / (th / 2) - dx / (tw / 2)) / 2;
      return { gx: Math.floor(gx), gy: Math.floor(gy) };
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const originX = canvas.width / 2;
      const originY = canvas.height * 0.45;
      const tile = screenToIso(e.clientX - rect.left, e.clientY - rect.top, originX, originY);
      state.hoveredTile = (tile.gx >= 0 && tile.gx < GRID_SIZE && tile.gy >= 0 && tile.gy < GRID_SIZE) ? tile : null;
    });

    canvas.addEventListener('click', () => {
      if (!state.hoveredTile) return;
      const target = state.hoveredTile;
      const targetUnit = state.unit === 'female' ? state.units.female : state.units.male;
      if (state.anim === 'sword' || state.anim === 'bow') {
        const dx = target.gx - targetUnit.gx;
        const dy = target.gy - targetUnit.gy;
        if (Math.hypot(dx, dy) > 0.1) {
          setDir(computeDir(dx, dy));
        }
        state.frame = 0;
        return;
      }
      targetUnit.tx = target.gx;
      targetUnit.ty = target.gy;
      targetUnit.moving = true;
    });

    function computeDir(dx, dy) {
      return Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'SE' : 'NW') : (dy >= 0 ? 'SW' : 'NE');
    }

    function updateUnitMotion(u, dt, idxOffset) {
      if (state.anim === 'patrol' && !u.moving) {
        const waypoints = [
          { x: 0.5, y: 0.5 }, { x: 3.5, y: 0.5 }, { x: 3.5, y: 3.5 }, { x: 0.5, y: 3.5 }
        ];
        u.wpIdx = ((u.wpIdx || 0) + 1) % waypoints.length;
        const wp = waypoints[(u.wpIdx + idxOffset) % waypoints.length];
        u.tx = wp.x;
        u.ty = wp.y;
        u.moving = true;
      }

      const dx = u.tx - u.gx;
      const dy = u.ty - u.gy;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.04) {
        u.moving = true;
        u.dir = computeDir(dx, dy);
        state.dir = u.dir;
        updateButtons();
        const isRunning = (state.anim === 'run' || state.anim === 'patrol');
        const baseSpeed = isRunning ? 2.45 : 1.45;
        const speed = baseSpeed * (state.fps / 10) * dt;
        const step = Math.min(dist, speed);
        u.gx += (dx / dist) * step;
        u.gy += (dy / dist) * step;
      } else {
        u.gx = u.tx;
        u.gy = u.ty;
        u.moving = false;
      }
    }

    function drawTile(gx, gy, originX, originY, isLight) {
      const tw = TILE_W * state.zoom;
      const th = TILE_H * state.zoom;
      const p = isoToScreen(gx, gy, originX, originY);
      const isHover = state.hoveredTile && state.hoveredTile.gx === gx && state.hoveredTile.gy === gy;

      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + tw / 2, p.y + th / 2);
      ctx.lineTo(p.x, p.y + th);
      ctx.lineTo(p.x - tw / 2, p.y + th / 2);
      ctx.closePath();

      const checker = (gx + gy) % 2 === 0;
      if (isHover) {
        ctx.fillStyle = (state.anim === 'sword' || state.anim === 'bow') ? 'rgba(244, 63, 94, 0.28)' : 'rgba(56, 189, 248, 0.28)';
      } else if (isLight) {
        ctx.fillStyle = checker ? 'rgba(148, 163, 184, 0.24)' : 'rgba(100, 116, 139, 0.16)';
      } else {
        ctx.fillStyle = checker ? 'rgba(51, 56, 68, 0.65)' : 'rgba(38, 42, 52, 0.65)';
      }
      ctx.fill();
      ctx.lineWidth = isHover ? 1.5 : 1;
      ctx.strokeStyle = isHover
        ? ((state.anim === 'sword' || state.anim === 'bow') ? 'rgba(244, 63, 94, 0.85)' : 'rgba(56, 189, 248, 0.85)')
        : (isLight ? 'rgba(100, 116, 139, 0.35)' : 'rgba(148, 163, 184, 0.22)');
      ctx.stroke();

      if (gx === GRID_SIZE - 1 || gy === GRID_SIZE - 1) {
        const depth = 7 * state.zoom;
        ctx.fillStyle = isLight ? 'rgba(71, 85, 105, 0.35)' : 'rgba(20, 23, 30, 0.8)';
        if (gx === GRID_SIZE - 1) {
          ctx.beginPath();
          ctx.moveTo(p.x + tw / 2, p.y + th / 2);
          ctx.lineTo(p.x, p.y + th);
          ctx.lineTo(p.x, p.y + th + depth);
          ctx.lineTo(p.x + tw / 2, p.y + th / 2 + depth);
          ctx.closePath();
          ctx.fill();
        }
        if (gy === GRID_SIZE - 1) {
          ctx.beginPath();
          ctx.moveTo(p.x - tw / 2, p.y + th / 2);
          ctx.lineTo(p.x, p.y + th);
          ctx.lineTo(p.x, p.y + th + depth);
          ctx.lineTo(p.x - tw / 2, p.y + th / 2 + depth);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    function drawCharacter(charType, u, originX, originY) {
      const dir = u.moving ? u.dir : state.dir;
      const isRear = (dir === 'NW' || dir === 'NE');
      const flipX = isRear ? (dir === 'NE') : (dir === 'SW');
      const sheetKey = charType + '_' + (isRear ? 'nw' : 'se');
      const sheet = images[sheetKey];
      if (!sheet || !sheet.complete || sheet.naturalWidth === 0) return;

      let row = 0;
      if (state.anim === 'sword') row = 3;
      else if (state.anim === 'bow') row = 4;
      else if (state.anim === 'run' || state.anim === 'patrol') row = 2;
      else if (state.anim === 'walk' || u.moving) row = 1;
      const col = state.frame;

      const fw = sheet.naturalWidth / FRAME_COLS;
      const fh = sheet.naturalHeight / FRAME_ROWS;
      const sx = col * fw;
      const sy = row * fh;

      const center = isoToScreen(u.gx + 0.5, u.gy + 0.5, originX, originY);
      // 256x340 aspect ratio -> 128x170 at 1.0x scale (keeps character exact same height as before!)
      const drawW = 128 * state.zoom;
      const drawH = 170 * state.zoom;

      const isAirborne = (row === 2 && (col === 3 || col === 7));
      const shadowScale = isAirborne ? 0.74 : 1.0;
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(center.x, center.y, 18 * state.zoom * shadowScale, 9 * state.zoom * shadowScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = isAirborne ? 'rgba(0, 0, 0, 0.28)' : 'rgba(0, 0, 0, 0.42)';
      ctx.fill();
      ctx.restore();

      // Archeotek Temporal Trail on Walk, Run, and Sword Impact!
      if (state.temporalTrail && (row === 1 || row === 2 || (row === 3 && (col === 3 || col === 4 || col === 5)))) {
        const ghosts = (row === 2 || row === 3) ? 2 : 1;
        const offsetDir = {
          'SE': { x: -9, y: -4.5 },
          'SW': { x: 9, y: -4.5 },
          'NW': { x: 9, y: 4.5 },
          'NE': { x: -9, y: 4.5 }
        }[dir];

        for (let g = ghosts; g >= 1; g--) {
          const ghostCol = (col + FRAME_COLS - g) % FRAME_COLS;
          const gsx = ghostCol * fw;
          ctx.save();
          ctx.translate(center.x + offsetDir.x * g * state.zoom, center.y + offsetDir.y * g * state.zoom);
          if (flipX) ctx.scale(-1, 1);
          ctx.globalAlpha = g === 1 ? 0.28 : 0.14;
          ctx.filter = 'hue-rotate(165deg) saturate(240%) brightness(1.3)';
          ctx.drawImage(sheet, gsx, sy, fw, fh, -drawW / 2, -drawH + 10 * state.zoom, drawW, drawH);
          ctx.restore();
        }
      }

      ctx.save();
      ctx.translate(center.x, center.y);
      if (flipX) ctx.scale(-1, 1);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sheet, sx, sy, fw, fh, -drawW / 2, -drawH + 10 * state.zoom, drawW, drawH);
      ctx.restore();
    }

    let lastTs = performance.now();
    function render(ts) {
      const dt = Math.min(0.1, (ts - lastTs) / 1000);
      lastTs = ts;

      if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }

      if (state.playing && ts - state.lastFrameTime >= 1000 / state.fps) {
        state.frame = (state.frame + 1) % FRAME_COLS;
        state.lastFrameTime = ts;
      }

      updateUnitMotion(state.units.male, dt, 0);
      updateUnitMotion(state.units.female, dt, 2);

      const isLight = document.documentElement.classList.contains('light');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const originX = canvas.width / 2;
      const originY = canvas.height * 0.45;

      for (let gx = 0; gx < GRID_SIZE; gx++) {
        for (let gy = 0; gy < GRID_SIZE; gy++) {
          drawTile(gx, gy, originX, originY, isLight);
        }
      }

      const activeList = [];
      if (state.unit === 'both' || state.unit === 'male') activeList.push({ type: 'male', u: state.units.male });
      if (state.unit === 'both' || state.unit === 'female') activeList.push({ type: 'female', u: state.units.female });
      activeList.sort((a, b) => (a.u.gx + a.u.gy) - (b.u.gx + b.u.gy));
      activeList.forEach(item => drawCharacter(item.type, item.u, originX, originY));

      const labels = {
        idle: 'Idle (Breath)',
        walk: 'Walk',
        run: 'Run ⚡',
        sword: 'Sword ⚔️',
        bow: 'Bow 🏹',
        patrol: 'Sprint Patrol'
      };
      const activeDir = activeList[0] && activeList[0].u.moving ? activeList[0].u.dir : state.dir;
      document.getElementById('statusBadge').textContent =
        `Frame ${state.frame + 1}/${FRAME_COLS} · ${labels[state.anim]} (${activeDir}) · ${state.fps} FPS`;

      requestAnimationFrame(render);
    }

    window.addEventListener('themechange', () => { lastTs = performance.now(); });
    setUnit('both');
    setAnim('sword');
    requestAnimationFrame(render);
  </script>
</body>
</html>
